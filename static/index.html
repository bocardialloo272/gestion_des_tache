<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion des tâches</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f6fc; margin: 0; padding: 24px; color: #222; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { color: #1f4e79; margin-top: 0; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px; border: 1px solid #bfd0e6; border-radius: 6px; font-size: 16px; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; background: #1f4e79; color: #fff; cursor: pointer; font-size: 15px; }
    button.suppr { background: #c0392b; padding: 6px 10px; font-size: 13px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e3ebf5; }
    li span { flex: 1; cursor: pointer; }
    li.finie span { text-decoration: line-through; color: #888; }
    .vide { color: #888; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Gestion des tâches</h1>
    <form id="formulaire">
      <input type="text" id="titre" placeholder="Nouvelle tâche…" required>
      <button type="submit">Ajouter</button>
    </form>
    <ul id="liste"></ul>
  </main>

  <script>
    const liste = document.getElementById("liste");
    const formulaire = document.getElementById("formulaire");
    const champ = document.getElementById("titre");

    async function charger() {
      const taches = await (await fetch("/api/taches")).json();
      liste.innerHTML = "";
      if (taches.length === 0) {
        liste.innerHTML = '<li class="vide">Aucune tâche pour le moment.</li>';
        return;
      }
      for (const t of taches) {
        const li = document.createElement("li");
        if (t.terminee) li.className = "finie";
        const texte = document.createElement("span");
        texte.textContent = t.titre;
        texte.title = "Cliquer pour terminer / rouvrir";
        texte.onclick = async () => { await fetch("/api/taches/" + t.id, { method: "PATCH" }); charger(); };
        const bouton = document.createElement("button");
        bouton.className = "suppr";
        bouton.textContent = "Supprimer";
        bouton.onclick = async () => { await fetch("/api/taches/" + t.id, { method: "DELETE" }); charger(); };
        li.append(texte, bouton);
        liste.appendChild(li);
      }
    }

    formulaire.onsubmit = async (e) => {
      e.preventDefault();
      await fetch("/api/taches", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titre: champ.value })
      });
      champ.value = "";
      charger();
    };

    charger();
  </script>
</body>
</html>
