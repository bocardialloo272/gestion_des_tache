name: Pipeline Gestion des tâches

on:
  push:
    branches: ["main"]
  workflow_dispatch:       

permissions:
  contents: read

env:
  NOM_IMAGE: gestion-taches
  TAG_IMAGE: 1.${{ github.run_number }}    

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: 2. Vérification du projet (tests)
        run: pytest

      - name: 3. Docker Build
        run: docker build -t ${{ env.NOM_IMAGE }}:${{ env.TAG_IMAGE }} .

    needs: ci                
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NOM_IMAGE }}:${{ env.TAG_IMAGE }}

  deploy:
    needs: push
    runs-on: [self-hosted, windows]   
    steps:
      - name: Télécharger la nouvelle image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NOM_IMAGE }}:${{ env.TAG_IMAGE }}

      - name: Remplacer le conteneur
        run: |
          $ancien = docker ps -a --filter "name=^gestion-taches$" -q
          if ($ancien) { docker rm -f gestion-taches }
          docker run -d --name gestion-taches -p 8080:3000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NOM_IMAGE }}:${{ env.TAG_IMAGE }}

      - name: 3. Vérification (test HTTP)
        run: |
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8080/health -UseBasicParsing
              if ($r.StatusCode -eq 200) { Write-Host "Application accessible : OK"; exit 0 }
            } catch { Start-Sleep -Seconds 3 }
          }
          Write-Host "L'application ne répond pas"
          exit 1
